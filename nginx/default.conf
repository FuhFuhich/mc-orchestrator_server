server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA has two real pages: index.html and auth.html.
    # Serve them directly — fall back to auth.html for unknown paths so the
    # client-side router / sign-in screen can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Let the browser cache static assets aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache HTML — we want new deploys to reach users instantly.
    location ~ \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Basic security headers.
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection          "1; mode=block" always;
}
