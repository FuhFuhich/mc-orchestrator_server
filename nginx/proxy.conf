# ═════════════════════════════════════════════════════════════════════════════
# Public-facing reverse proxy for mc-orchestrator.xyz
# Routes:
#   /api/*        → backend  (http://app:8080)
#   /ws, /ws/*    → backend WebSocket (SockJS / STOMP)
#   /actuator/*   → backend (health only, through auth in app)
#   /             → web      (static frontend served by mc-web)
# ═════════════════════════════════════════════════════════════════════════════

# Upgrade-header map needed for WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTP :80 — ACME challenges + permanent redirect to HTTPS.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mc-orchestrator.xyz www.mc-orchestrator.xyz;

    # Let's Encrypt webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS :443 — main site.
#
# Requires certs issued first: `docker compose run --rm certbot`.
# If you haven't issued certs yet, comment out this entire server{} block,
# run certbot, then uncomment and reload.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mc-orchestrator.xyz www.mc-orchestrator.xyz;

    ssl_certificate     /etc/letsencrypt/live/mc-orchestrator.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mc-orchestrator.xyz/privkey.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Upload limits — keep in sync with application.properties
    # (2300MB multipart + overhead).
    client_max_body_size      2500m;
    client_body_timeout       600s;
    proxy_read_timeout        600s;
    proxy_send_timeout        600s;
    send_timeout              600s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── API ─────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://app:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ─── WebSocket (SockJS/STOMP) ───────────────────────────────────────────
    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ─── Health (no auth) ───────────────────────────────────────────────────
    location = /actuator/health {
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── Everything else → static frontend ──────────────────────────────────
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
