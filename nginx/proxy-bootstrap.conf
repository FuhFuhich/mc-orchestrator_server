# ═════════════════════════════════════════════════════════════════════════════
# Bootstrap proxy config — use this BEFORE you have a Let's Encrypt cert.
#
# It listens only on :80 and serves two purposes:
#   1. Serves ACME HTTP-01 challenges so certbot can issue certificates.
#   2. Proxies everything else so the site is reachable over plain HTTP
#      while the cert is being issued (handy for first-boot testing).
#
# After you successfully run `docker compose run --rm certbot`, swap this
# file for nginx/proxy.conf (which terminates TLS on :443) and reload:
#
#     sed -i 's|proxy-bootstrap.conf|proxy.conf|' docker-compose.yml
#     docker compose up -d proxy
#
# Or just edit docker-compose.yml to mount ./nginx/proxy.conf instead of this.
# ═════════════════════════════════════════════════════════════════════════════

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mc-orchestrator.xyz www.mc-orchestrator.xyz _;

    # Let's Encrypt webroot — MUST come before any other location.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    client_max_body_size 2500m;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /actuator/health {
        proxy_pass http://app:8080/actuator/health;
        access_log off;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
    }
}
