spring.application.name=mine_com_server

# ===== SERVER =====
server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# The backend sits behind nginx in production. Honor X-Forwarded-* headers so
# WebSocket upgrades and absolute URLs work correctly when proxied over HTTPS.
server.forward-headers-strategy=framework

# ===== DATABASE =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mc_orchestrator}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== ASYNC =====
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=mc-async-

# ===== SCHEDULER =====
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=mc-scheduler-

# ===== ENCRYPTION =====
# 32-character AES key for encrypting SSH/RCON credentials at rest.
# The default below is a DEV-ONLY placeholder. In production you MUST override
# APP_ENCRYPTION_KEY via env (docker-compose env / .env / systemd EnvironmentFile).
# Do NOT change the key after data has been written — already-stored credentials
# will become undecryptable.
app.encryption.key=${APP_ENCRYPTION_KEY:dev-only-encryption-key-32-chars!}

# ===== JWT =====
# DEV-ONLY default. In production APP_JWT_SECRET MUST be overridden via env
# (min 32 bytes, randomly generated). The docker-entrypoint.sh will auto-generate
# a random secret if this placeholder is still in use at container start.
app.jwt.secret=${APP_JWT_SECRET:change-me-in-env-with-at-least-32-bytes}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.refresh-token.expiration-days=${APP_REFRESH_TOKEN_EXPIRATION_DAYS:30}

# ===== WEBSOCKET =====
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536

# ===== CORS =====
# Comma-separated list of allowed origins. Override via APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500}

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ===== LOGGING =====
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.level.com.example.mine_com_server=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ===== FILE UPLOAD LIMITS =====
spring.servlet.multipart.max-file-size=${APP_MULTIPART_MAX_FILE_SIZE:2300MB}
spring.servlet.multipart.max-request-size=${APP_MULTIPART_MAX_REQUEST_SIZE:2350MB}
spring.servlet.multipart.file-size-threshold=${APP_MULTIPART_FILE_SIZE_THRESHOLD:2MB}

# Embedded Tomcat: do not abort large uploads early.
server.tomcat.max-swallow-size=${APP_TOMCAT_MAX_SWALLOW_SIZE:-1}
server.tomcat.max-http-form-post-size=${APP_TOMCAT_MAX_HTTP_FORM_POST_SIZE:-1}
server.tomcat.connection-timeout=${APP_TOMCAT_CONNECTION_TIMEOUT:300000}
server.tomcat.keep-alive-timeout=${APP_TOMCAT_KEEP_ALIVE_TIMEOUT:300000}

# ===== HikariPool =====
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ===== REMOTE NODE PATHS =====
# Root directory on every managed node. Passed as MC_ROOT env var to Bash scripts.
# NOT user-specific — pick any absolute path that the SSH user can write to.
# Override via APP_REMOTE_ROOT env variable.
app.remote.root=${APP_REMOTE_ROOT:/opt/mc-com}

# RAM (tmpfs) path for Docker servers deployed to RAM storage.
# /dev/shm is always available and intentionally NOT under app.remote.root.
app.remote.docker.ram-path=${APP_REMOTE_DOCKER_RAM_PATH:/dev/shm/mc-com/servers}

# ===== VM-MODE BUNDLES (optional) =====
# Directory holding pre-built MC server bundles for VM-mode deploys.
# Leave empty to load bundles from the classpath (src/main/resources/server-dist/).
# In Docker deployments the bundles are excluded from the JAR — bind-mount the
# folder as /app/server-dist and set APP_SERVER_DIST_ROOT=/app/server-dist.
app.server-dist.root=${APP_SERVER_DIST_ROOT:}
