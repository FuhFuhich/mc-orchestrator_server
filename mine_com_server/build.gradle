plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'mine_com_server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // SSH
    implementation 'com.github.mwiede:jsch:0.2.17'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // DB
    runtimeOnly 'org.postgresql:postgresql'

    // Dev
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Skip tests when building the bootJar for Docker.
tasks.named('bootJar') {
    archiveBaseName.set('app')
    archiveVersion.set('')

    // Exclude huge pre-built MC server bundles from the JAR.
    // They are only needed by VM-mode deploys, which expect bundles on the
    // remote node's filesystem. For Docker-mode deploys the bundles are not
    // needed (scripts download everything from the internet).
    // If VM mode is used, mount the 'server-dist' directory into the running
    // container at /app/server-dist and set APP_SERVER_DIST_ROOT=/app/server-dist.
    exclude 'server-dist/**'
}

tasks.named('processResources') {
    // Same exclusion for local dev: bundles don't go into build/resources/main
    // (they're huge and slow down incremental builds).
    exclude 'server-dist/**'
}
